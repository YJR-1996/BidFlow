services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bidflow-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/backend/uploads
      - ./data:/app/backend/data
      - ./chroma:/app/backend/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
