<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .ai-glow {
            box-shadow: 0 0 20px rgba(0, 91, 191, 0.15);
        }
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        input:focus {
            outline: none;
            border-color: #005bbf !important;
            box-shadow: 0 0 0 2px rgba(0, 91, 191, 0.1);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-surface overflow-hidden">
<div class="flex h-screen w-full">
<!-- Left Side: Brand Visual Area -->
<div class="hidden lg:flex flex-col justify-center px-16 w-1/2 bg-primary relative overflow-hidden">
<!-- Animated Background Placeholder -->

<div class="relative z-10 space-y-6">
<div class="flex items-center gap-3">
<div class="w-12 h-12 bg-on-primary rounded-xl flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-headline-md text-display-lg text-on-primary tracking-tight">BidFlow AI</h1>
</div>
<div class="space-y-2">
<h2 class="text-3xl font-bold text-on-primary">智能编制与合规核查平台</h2>
<p class="text-on-primary/80 text-lg max-w-md font-body-md leading-relaxed">
                        加速招投标流程，保障文件合规性。利用深度学习与大语言模型，为您的采购与投标提供全方位的技术支撑。
                    </p>
</div>
<div class="grid grid-cols-2 gap-4 pt-8">
<div class="p-4 rounded-lg bg-white/10 backdrop-blur-sm border border-white/20">
<span class="material-symbols-outlined text-on-primary mb-2">speed</span>
<p class="text-on-primary font-bold">效率提升 70%</p>
<p class="text-on-primary/60 text-sm">自动化文档生成</p>
</div>
<div class="p-4 rounded-lg bg-white/10 backdrop-blur-sm border border-white/20">
<span class="material-symbols-outlined text-on-primary mb-2">verified</span>
<p class="text-on-primary font-bold">100% 合规</p>
<p class="text-on-primary/60 text-sm">法规智能实时核查</p>
</div>
</div>
</div>
<!-- Decoration Image -->
<div class="absolute -bottom-20 -right-20 w-96 h-96 opacity-20 pointer-events-none">
<div class="w-full h-full bg-cover" data-alt="A high-tech digital abstract representation of flowing documents and data streams in a corporate blue professional environment. Minimalist architectural lines and glowing nodes representing AI intelligence, rendered in a clean corporate modern style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBwGWiPIEfC07ZL7caKQdqSCQwEJr7UF4wH4ulE294Zt_IVqtl5Lg_zjqy0sKOQQGoUBCnYf3fFW2gPPcuI21LU-w--dpjBGJ9FirDy6UoM1JGQZ7O--H-mpcOsHkp-YFBwcZvN4tfLStQNciM_87uSeM9-21lSsqjgSKPIMFhoD-5PcAUu7XyGGZ9-dPYIWW-7u4IJsqFgwdowG07-yCGbkSk_zSmw1EROUaFCaewS1h0ciTWSKc-S')"></div>
</div>
</div>
<!-- Right Side: Login Form Area -->
<div class="flex flex-col justify-center items-center w-full lg:w-1/2 p-8 bg-surface-bright">
<div class="w-full max-w-[440px] space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="text-center lg:text-left">
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">欢迎回来</h3>
<p class="text-on-surface-variant">请登录您的账户以开始工作</p>
</div>
<!-- Login Card -->
<div class="bg-white p-8 rounded-2xl shadow-sm border border-outline-variant ai-glow">
<form class="space-y-6" id="loginForm" onsubmit="handleLogin(event)">
<!-- Username Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant px-1">用户名</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg text-on-surface focus:ring-2 focus:ring-primary/20 transition-all" id="username" placeholder="请输入用户名" required="" type="text"/>
</div>
<p class="text-error text-xs hidden" id="userError">用户名至少需要 3 位字符</p>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-sm font-semibold text-on-surface-variant">密码</label>
<a class="text-xs text-primary hover:underline" href="#">忘记密码？</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-12 py-3 bg-white border border-outline-variant rounded-lg text-on-surface focus:ring-2 focus:ring-primary/20 transition-all" id="password" placeholder="请输入密码" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
<p class="text-error text-xs hidden" id="pwdError">密码至少需要 6 位字符</p>
</div>
<!-- Action Button -->
<button class="relative w-full bg-primary text-on-primary py-3 px-4 rounded-lg font-semibold hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 overflow-hidden" id="loginBtn" type="submit">
<span id="btnText">登录</span>
<div class="hidden" id="loadingIcon">
<span class="material-symbols-outlined loading-spinner text-[20px]">progress_activity</span>
</div>
</button>
<div class="flex items-center gap-4 py-2">
<div class="flex-1 h-[1px] bg-outline-variant"></div>
<span class="text-xs text-outline">其他登录方式</span>
<div class="flex-1 h-[1px] bg-outline-variant"></div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 py-2 border border-outline-variant rounded-lg hover:bg-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">fingerprint</span>
<span class="text-sm">指纹</span>
</button>
<button class="flex items-center justify-center gap-2 py-2 border border-outline-variant rounded-lg hover:bg-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">qr_code</span>
<span class="text-sm">扫码</span>
</button>
</div>
</form>
</div>
<!-- Footer Link -->
<div class="text-center">
<p class="text-on-surface-variant text-sm">
                        还没有账号？
                        <a class="text-primary font-semibold hover:underline" href="/register">立即注册</a>
</p>
</div>
</div>
</div>
</div>
<!-- Message Toast (Floating) -->
<div class="fixed top-8 left-1/2 -translate-x-1/2 z-[100] pointer-events-none transform -translate-y-full opacity-0 transition-all duration-300" id="messageToast">
<div class="bg-on-tertiary-fixed text-on-tertiary px-6 py-3 rounded-full shadow-lg flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary-fixed-dim">check_circle</span>
<span id="toastContent">登录成功</span>
</div>
</div>
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const userError = document.getElementById('userError');
            const pwdError = document.getElementById('pwdError');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loadingIcon');
            const toast = document.getElementById('messageToast');

            let isValid = true;

            if (user.length < 3) {
                userError.classList.remove('hidden');
                isValid = false;
            } else {
                userError.classList.add('hidden');
            }

            if (pass.length < 6) {
                pwdError.classList.remove('hidden');
                isValid = false;
            } else {
                pwdError.classList.add('hidden');
            }

            if (!isValid) return;

            // Loading state
            btn.disabled = true;
            btnText.textContent = '处理中...';
            loader.classList.remove('hidden');
            btn.classList.add('opacity-80');

            // Simulate API Call
            setTimeout(() => {
                localStorage.setItem('access_token', 'bidflow_ai_token_' + btoa(user));
                
                // Show Success Toast
                toast.classList.remove('opacity-0', '-translate-y-full');
                
                setTimeout(() => {
                    // Redirect simulation
                    console.log('Redirecting to /projects...');
                    window.location.href = '/projects';
                }, 1500);
            }, 1200);
        }

        // Intercepting focus to clear errors
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                const errId = input.id === 'username' ? 'userError' : 'pwdError';
                document.getElementById(errId).classList.add('hidden');
            });
        });
    </script>
</body></html>
